name: DiscordBotHost Renew

# The panel only opens "Renew for 7 days" AFTER the bot goes offline,
# so this checks twice a day: online + not due -> exit quietly;
# offline -> renew (+7 days) and start it again.
on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Run renew flow
        env:
          DISCORD_EMAIL: ${{ secrets.DISCORD_EMAIL }}
          DISCORD_PASSWORD: ${{ secrets.DISCORD_PASSWORD }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          BOT_ID: ${{ vars.BOT_ID }}
        run: xvfb-run --auto-servernum python3 renew.py

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renew-screenshots
          path: scripts/artifacts/
          if-no-files-found: ignore
